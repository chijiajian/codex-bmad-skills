name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install helper dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate plugin and skills
        run: ./scripts/validate.sh

      - name: Check shell syntax
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Parse JSON files
        run: |
          find . -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Parse OpenAI YAML metadata
        run: |
          ruby -e 'require "yaml"; Dir["plugins/codex-bmad-planning-orchestrator/skills/*/agents/openai.yaml"].each { |f| YAML.load_file(f) }'

      - name: Compile Python helpers
        run: |
          find . -name '*.py' -print0 | xargs -0 env PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m py_compile

      - name: Smoke test skills-only install
        run: |
          skills_dest="${RUNNER_TEMP}/codex-skills"
          ./scripts/install-skills.sh --destination "$skills_dest"
          test -f "$skills_dest/bmad-help/SKILL.md"
          test -d "$skills_dest/_bmad-shared/scripts"
          test -d "$skills_dest/_bmad-shared/references"
          if grep -R -E '\.\./\.\./(scripts|references)/' "$skills_dest"/bmad-*; then
            echo "Found stale relative shared-resource references after install." >&2
            exit 1
          fi
